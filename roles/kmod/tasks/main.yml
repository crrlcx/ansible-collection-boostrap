---
- name: Set kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/modules.conf
    content: |
      # /etc/modules is obsolete and has been replaced by /etc/modules-load.d/.
      # Please see modules-load.d(5) and modprobe.d(5) for details.
      #
      # Updating this file still works, but it is undocumented and unsupported.
      {% for module in kmod_modules %}
      {{ module }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  when:
    - kmod_modules is defined
    - kmod_modules | length > 0
  notify:
    - update modprobe

- name: Set initramfs modules
  ansible.builtin.copy:
    dest: /etc/initramfs-tools/modules
    content: |
      #
      # You must run update-initramfs(8) to effect this change.
      #
      {% for module in kmod_initramfs_modules %}
      {{ module }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  when:
    - kmod_initramfs_modules is defined
    - kmod_initramfs_modules | length > 0
  notify:
    - update initramfs

- name: Set RESUME= in initramfs-tools conf
  ansible.builtin.lineinfile:
    dest: /etc/initramfs-tools/conf.d/resume
    create: true
    regexp: "^(#|)RESUME="
    line: "RESUME={{ kmod_initramfs_resume }}"
    state: present
    owner: root
    group: root
    mode: "0644"
  when:
    - kmod_initramfs_resume_set | bool
  notify:
    - update initramfs

- name: Add initramfs hooks when enabled
  ansible.builtin.include_tasks:
    file: initramfs-hooks.yml
  when:
    - kmod_initramfs_hooks_add | bool

- name: Set modprobe options
  ansible.builtin.copy:
    dest: /etc/modprobe.d/options.conf
    content: |
      #
      # You must run update-initramfs(8) to effect this change.
      #
      {% for option in kmod_modprobe_options %}
      {{ option }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  when:
    - kmod_modprobe_options is defined
    - kmod_modprobe_options | length > 0
  notify:
    - update modprobe
    - update initramfs

- name: Ensure handlers are flushed
  ansible.builtin.meta: flush_handlers
